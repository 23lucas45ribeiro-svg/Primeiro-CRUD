<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CRUD - Lista de Tarefas</title>
</head>
<body>
    <!-- 
    CRUD

    c = Create / Criar
    R = Read / Ler
    U = Update / Atualizar
    D = Delete  / Deletar
    
    -->

    <div class="container">

        <div class="div-card"> 
            
            <h2 class="titulo-container">Coloque um valor</h2>
            
            <section class="sessao-entrada">
                <input class="sessao-entrada-input" id="entrada" type="text">
                <button class="botao-container" onclick="salvarDados()">Adicionar</button>
            </section>
            
            
            <br>
            
            <section class="sessao-resultados">

                
                <h3 class="sub-titulo">Lista de itens:</h3>

                <div id="editar"></div>
                
                <section class="sessao-elementos">
                    <ul id="resultado">
                        <!-- <li></li> -->
                    </ul>
                </section>
                
            </section>
        
        </div>
        
    </div>

    <footer class="roda-pe"></footer>

    <script src="script.js"></script>
</body>
</html>
